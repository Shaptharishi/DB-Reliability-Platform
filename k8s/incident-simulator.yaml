apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: incident-simulator
  template:
    metadata:
      labels:
        app: incident-simulator
    spec:
      containers:
        - name: simulator
          image: db-test-platform-collector:latest
          imagePullPolicy: Never
          command: ["python3"]
          args: ["test_trigger_alert.py"]