apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-clickhouse
  template:
    metadata:
      labels:
        app: agent-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:latest
          ports:
            - containerPort: 8123
            - containerPort: 9000
          env:
            - name: CLICKHOUSE_PASSWORD
              value: "agentpass"
          resources:
            limits:
              memory: "500Mi"
            requests:
              memory: "300Mi"
          volumeMounts:
            - name: clickhouse-storage
              mountPath: /var/lib/clickhouse
      volumes:
        - name: clickhouse-storage
          persistentVolumeClaim:
            claimName: agent-clickhouse-pvc