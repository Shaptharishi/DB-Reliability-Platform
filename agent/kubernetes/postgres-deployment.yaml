apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-postgres
  template:
    metadata:
      labels:
        app: agent-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "agentdb"
          resources:
            limits:
              memory: "300Mi"
            requests:
              memory: "150Mi"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: agent-postgres-pvc
        